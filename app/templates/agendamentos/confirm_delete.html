<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Excluir Lavagem</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="max-w-md mx-auto mt-20 bg-white p-6 rounded shadow text-center">
        <h1 class="text-xl font-bold mb-4">Tem certeza que deseja excluir esta lavagem?</h1>
        <p class="mb-6">
            Cliente: <strong>{{ lavagem.cliente.nome }}</strong><br>
            Tipo: <strong>{{ lavagem.tipo }}</strong><br>
            Data: <strong>{{ lavagem.data|date:"d/m/Y H:i" }}</strong>
        </p>

        <form method="post" class="space-x-4">
            {% csrf_token %}
            <a href="{% url 'listar_lavagens' %}" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">
                Cancelar
            </a>
            <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700">
                Confirmar Exclusão
            </button>
        </form>
    </div>

</body>
</html>
