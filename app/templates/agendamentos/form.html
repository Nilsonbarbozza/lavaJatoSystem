{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% if lavagem %}Editar{% else %}Nova{% endif %} Lavagem</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded shadow">
        <h1 class="text-2xl font-bold mb-6 text-center">
            {% if lavagem %}✏️ Editar{% else %}🧼 Nova{% endif %} Lavagem
        </h1>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block mb-1 font-semibold">Cliente:</label>
                <select name="cliente" required class="w-full p-2 border rounded">
                    {% for cliente in clientes %}
                        <option value="{{ cliente.id }}"
                            {% if lavagem and cliente.id == lavagem.cliente.id %}selected{% endif %}>
                            {{ cliente.nome }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block mb-1 font-semibold">Tipo de lavagem:</label>
                <input type="text" name="tipo" required value="{{ lavagem.tipo|default:'' }}"
                       class="w-full p-2 border rounded">
            </div>

            <div>
                <label class="block mb-1 font-semibold">Data:</label>
                <input type="datetime-local" name="data" required
                       value="{{ lavagem.data|date:'Y-m-d\\TH:i'|default:'' }}"
                       class="w-full p-2 border rounded">
            </div>

            {% if lavagem %}
            <div class="flex items-center">
                <input type="checkbox" name="concluida" id="concluida"
                       {% if lavagem.concluida %}checked{% endif %}>
                <label for="concluida" class="ml-2">Lavagem concluída</label>
            </div>
            {% endif %}

            <div class="flex justify-between mt-6">
                <a href="{% url 'listar_lavagens' %}" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">
                    Voltar
                </a>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Salvar
                </button>
            </div>
        </form>
    </div>

</body>
</html>
